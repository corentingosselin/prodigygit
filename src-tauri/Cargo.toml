[package]
name = "prodigygit"
version = "0.1.0"
description = "Client Git de bureau"
authors = ["prodigy"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "prodigygit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Network operations go through the git CLI (SSH agent, macOS keychain),
# so libgit2 is built without its own SSH/HTTPS transports.
git2 = { version = "0.20", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
